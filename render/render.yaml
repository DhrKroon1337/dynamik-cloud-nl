services:
  - type: web
    name: dynamik-cloud-backend-nl
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend-cloud-nl
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHARED_SECRET
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true
