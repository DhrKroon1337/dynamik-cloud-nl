services:
  - type: web
    name: dynamik-cloud-backend-nl
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend-cloud-nl/requirements.txt
    startCommand: uvicorn backend-cloud-nl.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: SHARED_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    autoDeploy: true
